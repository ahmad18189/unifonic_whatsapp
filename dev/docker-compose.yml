# Disposable Frappe v15 dev/test bench. Local use only; credentials below are throwaway test values.
# Usage: see dev/setup.sh.
name: uw-dev

services:
  mariadb:
    image: mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MARIADB_ROOT_PASSWORD: frappe-dev-root
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7-alpine

  bench:
    image: frappe/bench:latest
    # A fresh named volume is root-owned; hand it to the image's frappe user first.
    command: bash -c "sudo chown frappe:frappe /home/frappe/frappe-bench && exec sleep infinity"
    working_dir: /home/frappe
    environment:
      DB_ROOT_PASSWORD: frappe-dev-root
    volumes:
      - bench:/home/frappe/frappe-bench
      # The app is mounted live: edits on the host are seen by the bench immediately.
      - ..:/workspace/unifonic_whatsapp
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  mariadb-data:
  bench:
