[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "unifonic_whatsapp"
version = "0.1.0"
description = "Unifonic WhatsApp conversation integration for Frappe 15"
requires-python = ">=3.10"
authors = [{name = "Integration Team"}]
license = {text = "MIT"}
dependencies = ["requests>=2.31,<3"]

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"

[tool.ruff]
line-length = 110
